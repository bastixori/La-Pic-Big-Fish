<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta Física 30x14.5 cm — La Picá Big Fish</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Inter:wght@400;600;700;800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #03050a;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(0, 201, 177, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 162, 255, 0.1) 0%, transparent 40%);
            font-family: 'Inter', sans-serif;
            color: #f0f4ff;
            min-height: 100vh;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .controls-bar {
            background: rgba(10, 15, 29, 0.95);
            border: 1.5px solid #00c9b1;
            padding: 16px 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            max-width: 1200px;
            width: 100%;
        }

        .controls-bar h2 {
            color: #f0f4ff;
            font-size: 1.15rem;
            font-weight: 800;
            margin-right: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .controls-bar h2 i {
            color: #00c9b1;
        }

        .badge-dim {
            background: rgba(0, 201, 177, 0.15);
            color: #00c9b1;
            border: 1px solid #00c9b1;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 700;
        }

        .btn-action {
            background: #00c9b1;
            color: #040914;
            border: none;
            padding: 11px 22px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.92rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-action:hover {
            background: #00e0c5;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 201, 177, 0.5);
        }

        .btn-secondary {
            background: rgba(0, 162, 255, 0.15);
            color: #00a2ff;
            border: 1px solid #00a2ff;
        }

        .btn-secondary:hover {
            background: #00a2ff;
            color: #fff;
        }

        /* Leather Folder Container */
        .leather-folder {
            background: #1a120b;
            border: 14px solid #281a10;
            border-radius: 18px;
            padding: 22px 18px;
            box-shadow: 
                0 30px 90px rgba(0,0,0,0.95),
                inset 0 0 25px rgba(0,0,0,0.9);
            display: flex;
            gap: 20px;
            max-width: 100%;
            overflow-x: auto;
        }

        .folder-spine {
            width: 14px;
            background: linear-gradient(90deg, #100a06 0%, #301d12 50%, #100a06 100%);
            border-radius: 4px;
            box-shadow: inset 0 0 8px #000;
            flex-shrink: 0;
        }

        .menu-page-frame {
            /* 14.5cm x 30cm => 145mm x 300mm */
            width: 145mm;
            height: 300mm;
            border-radius: 6px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            position: relative;
            background: #060913;
            flex-shrink: 0;
        }

        .menu-page-frame object, .menu-page-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 6px;
        }

        #render-stage {
            position: absolute;
            left: -9999px;
            top: -9999px;
        }

        @media print {
            body { background: none; padding: 0; }
            .controls-bar, .leather-folder, .folder-spine { display: none; }
        }
    </style>
</head>
<body>

    <!-- Controls Bar -->
    <div class="controls-bar">
        <h2><i class="fa-solid fa-fish"></i> Carta Tradicional La Picá Big Fish (Física 30 x 14,5 cm)</h2>
        <span class="badge-dim"><i class="fa-solid fa-ruler-combined"></i> 14,5 cm x 30 cm por página</span>

        <a href="assets/Carta_BigFish_Hoja1_30x14.5cm.png" download="Carta_BigFish_Hoja1_30x14.5cm.png" class="btn-action">
            <i class="fa-solid fa-download"></i> Descargar Hoja 1 (Izquierda) PNG (30x14.5cm)
        </a>

        <a href="assets/Carta_BigFish_Hoja2_30x14.5cm.png" download="Carta_BigFish_Hoja2_30x14.5cm.png" class="btn-action">
            <i class="fa-solid fa-download"></i> Descargar Hoja 2 (Derecha) PNG (30x14.5cm)
        </a>

        <button onclick="window.print()" class="btn-action btn-secondary">
            <i class="fa-solid fa-print"></i> Imprimir (Ctrl+P)
        </button>

        <a href="carta_tradicional.html" class="btn-action btn-secondary">
            <i class="fa-solid fa-globe"></i> Ver Carta Web
        </a>
    </div>

    <!-- Leather Menu Folder View (Opens bi-fold) -->
    <div class="leather-folder">
        <!-- HOJA 1 (IZQUIERDA) -->
        <div class="menu-page-frame">
            <object data="assets/carta_fisica_hoja1.svg" type="image/svg+xml" width="100%" height="100%">
                <img src="assets/carta_fisica_hoja1.svg" alt="Carta Hoja 1 Izquierda">
            </object>
        </div>

        <!-- SPINE -->
        <div class="folder-spine"></div>

        <!-- HOJA 2 (DERECHA) -->
        <div class="menu-page-frame">
            <object data="assets/carta_fisica_hoja2.svg" type="image/svg+xml" width="100%" height="100%">
                <img src="assets/carta_fisica_hoja2.svg" alt="Carta Hoja 2 Derecha">
            </object>
        </div>
    </div>

    <div id="render-stage"></div>

    <script>
        function downloadAsPNG(svgUrl, fileName) {
            fetch(svgUrl)
                .then(res => res.text())
                .then(svgText => {
                    const img = new Image();
                    const svgBlob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
                    const url = URL.createObjectURL(svgBlob);

                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        canvas.width = 1450;
                        canvas.height = 3000;
                        const ctx = canvas.getContext('2d');

                        ctx.fillStyle = '#060913';
                        ctx.fillRect(0, 0, 1450, 3000);
                        ctx.drawImage(img, 0, 0, 1450, 3000);

                        const a = document.createElement('a');
                        a.download = fileName;
                        a.href = canvas.toDataURL('image/png', 1.0);
                        a.click();

                        URL.revokeObjectURL(url);
                    };

                    img.src = url;
                })
                .catch(err => alert('Error al descargar PNG: ' + err.message));
        }
    </script>
</body>
</html>
